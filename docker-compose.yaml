services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-directus}
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - directus-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  directus:
    image: ${DIRECTUS_IMAGE:-directus/directus:11.13.4}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?Set DIRECTUS_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in .env}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-directus}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WEBSOCKETS_ENABLED: "true"
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
    volumes:
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  carpool:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    ports:
      - "${CARPOOL_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_SERVER_HOST: ${PUBLIC_SERVER_HOST:-localhost}
      PUBLIC_SERVER_PORT: 4000
      API_URL: http://directus:8055
      API_TOKEN: ${API_TOKEN:?Create a Directus static token and set API_TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  directus-database:
  directus-uploads:
  directus-extensions:
